<style>
#image-popup {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 2147483647;
    background: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    overflow: hidden;
    box-sizing: border-box;
}

.image-popup-box {
    width: 100%;
    height: 100%;
    max-width: none !important;
    margin: 0;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
}

.image-popup-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 0;
    box-shadow: none;
}

.image-popup-box p {
    display: none;
}

#image-popup.hidden {
    display: none !important;
}
</style>

<script>
(function () {
    const popup = document.getElementById("image-popup");

    if (!popup) return;

    popup.addEventListener("click", async function () {

        // Remove popup immediately
        popup.remove();

        // Make website fullscreen
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            }
        } catch (error) {
            console.log("Fullscreen unavailable:", error);
        }

    });
})();
